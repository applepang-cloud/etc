<title>별빛 멜로디</title>
<meta name="description" content="음표 퍼즐을 풀어 여주인공의 노래를 완성하는 도트 퍼즐 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-column phone stage. Heroine scene on top (big for story, small during play), song strip, then the note board. */
:root {
  --night: #15123a;      /* page ground: rooftop night sky */
  --night-2: #221c57;    /* raised panels */
  --slot: #2c2766;       /* empty puzzle cell */
  --slot-line: #3d3785;
  --ink: #f4effe;        /* main text */
  --ink-dim: #aaa3d6;    /* secondary text, clues done */
  --pink: #ff8fc8;       /* accent: Ria's hair */
  --gold: #ffd45e;       /* star, given notes, ratings */
  --err: #ff5b78;
  --pixel: "DotGothic16", "Gowun Dodum", ui-monospace, monospace;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --cell: 34px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { max-width: 460px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 20px; display: flex; flex-direction: column; gap: 10px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-family: var(--pixel); font-size: 13px; letter-spacing: .12em; color: var(--pink); white-space: nowrap; }
.brand b { color: var(--gold); font-weight: 400; }
.meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-dim); min-width: 0; }
#stageLabel { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.icon-btn { background: var(--night-2); border: 1px solid var(--slot-line); border-radius: 6px; padding: 4px 9px; font-size: 13px; cursor: pointer; white-space: nowrap; flex: none; }

/* Scene */
.scene { position: relative; border-radius: 10px; overflow: hidden; overflow: clip; border: 1px solid var(--slot-line); background: linear-gradient(180deg, #0f0c2c 0%, #2a1f62 70%, #3a2370 100%); display: grid; transition: min-height .35s ease; }
.scene canvas.sky { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.scene .spot { position: absolute; left: 50%; bottom: -40%; width: 120%; height: 120%; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(255,143,200,.22), rgba(255,143,200,0)); pointer-events: none; }
.scene[data-size="big"] { grid-template-columns: 1fr; justify-items: center; padding-block: 14px 12px; padding-inline: 12px; gap: 10px; }
.scene[data-size="small"] { grid-template-columns: auto 1fr; align-items: end; padding-block: 8px 10px; padding-inline: 10px; gap: 10px; }
#heroine { position: relative; image-rendering: pixelated; display: block; transition: width .35s ease, height .35s ease; }
#heroine.bob { transform: translateY(calc(var(--px, 3px) * -1)); }

.talk { position: relative; align-self: stretch; display: flex; flex-direction: column; gap: 6px; min-width: 0; background: rgba(21, 18, 58, .95); border: 2px solid var(--ink); border-radius: 4px; box-shadow: 3px 3px 0 #0b0920; padding: 10px 12px; width: 100%; }
.scene[data-size="small"] .talk { align-self: end; padding: 8px 10px; }
.talk .who { position: absolute; top: -11px; left: 10px; background: var(--pink); color: #2a0d24; font-family: var(--pixel); font-size: 12px; padding: 1px 8px; border-radius: 3px; }
.talk p { margin: 4px 0 0; line-height: 1.55; font-size: 15px; min-height: 3.1em; word-break: keep-all; }
.scene[data-size="small"] .talk p { font-size: 14px; min-height: 0; }
.talk .act { display: flex; justify-content: flex-end; gap: 8px; }
.act button { font-family: var(--pixel); font-size: 14px; background: var(--gold); color: #2b1b00; border: 0; border-radius: 4px; padding: 7px 14px; box-shadow: 0 3px 0 #b8892a; cursor: pointer; }
.act button.ghost { background: transparent; color: var(--ink); box-shadow: none; border: 1px solid var(--slot-line); }
.act button:active { transform: translateY(2px); box-shadow: 0 1px 0 #b8892a; }

/* Song strip */
.song { display: flex; align-items: center; gap: 8px; }
.song .label { font-family: var(--pixel); font-size: 11px; letter-spacing: .1em; color: var(--ink-dim); white-space: nowrap; }
.bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; flex: 1; min-width: 0; }
.bar { position: relative; background: var(--night-2); border: 1px solid var(--slot-line); border-radius: 4px; padding: 3px; cursor: pointer; display: grid; gap: 2px; }
.bar canvas { width: 100%; aspect-ratio: 8 / 6; image-rendering: pixelated; display: block; }
.bar .n { font-family: var(--pixel); font-size: 10px; color: var(--ink-dim); display: flex; justify-content: space-between; }
.bar .n i { font-style: normal; color: var(--gold); letter-spacing: -1px; }
.bar[aria-current="true"] { border-color: var(--pink); }
.bar.playing { box-shadow: 0 0 0 2px var(--gold); }
.bar:disabled { cursor: default; opacity: .45; }

/* Board */
.board-wrap { background: var(--night-2); border: 1px solid var(--slot-line); border-radius: 10px; padding: 8px 8px 12px; overflow-x: auto; }
.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 4px 4px; font-size: 13px; color: var(--ink-dim); }
.board-head b { color: var(--ink); font-weight: 400; }
.board-head .miss { font-family: var(--pixel); font-variant-numeric: tabular-nums; }
.board { --lab: 34px; display: grid; grid-template-columns: var(--lab) auto repeat(8, var(--cell)); gap: 3px; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; }
.board .cc { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font-family: var(--pixel); font-size: 13px; line-height: 1.15; padding-bottom: 3px; font-variant-numeric: tabular-nums; }
.board .rc { display: flex; justify-content: flex-end; align-items: center; gap: 5px; font-family: var(--pixel); font-size: 13px; padding-right: 4px; font-variant-numeric: tabular-nums; }
.board .done { color: var(--ink-dim); opacity: .45; }
.board .lab { display: flex; align-items: center; justify-content: center; font-size: 12px; border-radius: 4px; color: #1b1440; background: var(--c); font-weight: 700; letter-spacing: -.04em; }
.board .lab.long { font-size: 10px; }
.cell { width: var(--cell); height: var(--cell); background: var(--slot); border-radius: 3px; position: relative; box-shadow: inset 0 0 0 1px var(--slot-line); }
.cell.beat { background: #322c72; }
.cell.ph { background: #3e3790; }
.cell.on { background: var(--c); box-shadow: inset 3px 3px 0 rgba(255,255,255,.45), inset -3px -3px 0 rgba(0,0,0,.25); }
.cell.on.hit { filter: brightness(1.35); }
.cell.given::after { content: ""; position: absolute; right: 3px; top: 3px; width: 8px; height: 8px; background: rgba(27, 20, 64, .6); clip-path: polygon(50% 0, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0 50%, 37% 37%); }
.cell.x::before, .cell.err::before { content: "×"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--pixel); font-size: 18px; color: var(--ink-dim); }
.cell.err::before { color: var(--err); }
.cell.err { box-shadow: inset 0 0 0 2px var(--err); }
.cell.pop { animation: pop .22s ease-out; }
@keyframes pop { 0% { transform: scale(.7); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
.board.locked { pointer-events: none; }

.controls { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--night-2); border: 1px solid var(--slot-line); border-radius: 6px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 4px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--pink); color: #2a0d24; }
.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.sw.fill { background: currentColor; }
.sw.mark { font-family: var(--pixel); line-height: 12px; text-align: center; }
.hint { font-size: 12px; color: var(--ink-dim); }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translate(-50%, -160%); visibility: hidden; background: var(--gold); color: #2b1b00; font-family: var(--pixel); padding: 8px 16px; border-radius: 6px; box-shadow: 0 4px 0 #b8892a; transition: transform .3s ease; z-index: 5; white-space: nowrap; }
.toast.show { transform: translate(-50%, 0); visibility: visible; }

[hidden] { display: none !important; }
@media (max-width: 380px) { .board .rc, .board .cc { font-size: 12px; } .brand { letter-spacing: .06em; } }
@media (prefers-reduced-motion: reduce) { #heroine, .scene, .toast { transition: none; } #heroine.bob { transform: none; } .cell.pop { animation: none; } }
</style>

<script>
// Procedural pixel-art portrait. drawHeroine(expr) -> {w, h, px: array of '#rrggbb' | null}
(function (root) {
const W = 64, H = 72, CX = 32;
const COL = {
  line: '#3a1d3f',
  skin: '#ffe6d8', skinS: '#f7bfae', skinD: '#c98478',
  hair: '#ff9cc9', hairS: '#e76aa8', hairD: '#a83d79', hairH: '#ffd6ea',
  cloth: '#f6f3ff', clothS: '#cfc8ee', clothD: '#7e74b8',
  navy: '#34407e', navyS: '#262f61', navyD: '#1a1f44',
  red: '#ff5b78', redS: '#d63a5c',
  phone: '#4a4e6e', phoneS: '#33364f', phoneH: '#7b80a6',
  cup: '#62dcff', cupS: '#2fa6d6', led: '#ff7ab8',
  tie: '#ffd45e', tieS: '#e6a92e',
  eyeL: '#2b1f4a', irisA: '#2e4fa3', irisB: '#4b8fe8', irisC: '#9be6ff', pupil: '#1a1846', hi: '#ffffff', scl: '#fbf8ff',
  blush: '#ff9fb4', mouth: '#b93a58', tongue: '#ff8a9c', sweat: '#9fe3ff'
};
const R = { tails: 1, back: 2, body: 3, collar: 4, ribbon: 5, neck: 6, face: 7, band: 8, cup: 9, bangs: 10, tie: 11 };
const PAL = {
  1: ['hair', 'hairS', 'hairD'], 2: ['hair', 'hairS', 'hairD'], 3: ['cloth', 'clothS', 'clothD'], 4: ['navy', 'navyS', 'navyD'],
  5: ['red', 'redS', 'line'], 6: ['skin', 'skinS', 'skinD'], 7: ['skin', 'skinS', 'skinD'], 8: ['phone', 'phoneS', 'line'],
  9: ['cup', 'cupS', 'line'], 10: ['hair', 'hairS', 'hairD'], 11: ['tie', 'tieS', 'line']
};
const ell = (x, y, cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
// face: round skull + soft pointed jaw
const face = (x, y) => { if (y < 32) return ell(x, y, CX, 32, 14, 15); if (y > 51) return false; const t = (y - 32) / 19; return Math.abs(x - CX) <= 14 * Math.pow(Math.max(0, 1 - Math.pow(t, 3)), 0.6); };
const skull = (x, y) => ell(x, y, CX, 30, 17.5, 17);
// bang strands: [topX, tipX, tipY, halfWidthTop]
const STRANDS = [[14, 15, 54, 3.6], [17, 18, 45, 3.4], [21, 22, 34, 3.4], [25, 25, 35, 3], [29, 30, 31, 3], [33, 33, 37, 2.8], [37, 39, 32, 3], [42, 42, 35, 3.4], [47, 46, 45, 3.4], [50, 49, 54, 3.6]];
function strand(x, y, s) { const [tx, px, py, hw] = s, top = 16; if (y < top || y > py) return false; const t = (y - top) / (py - top); const cx = tx + (px - tx) * t; const w = hw * Math.pow(1 - t, 0.8); return Math.abs(x - cx) <= w; }
const bangs = (x, y) => (skull(x, y) && y < 25) || STRANDS.some(s => strand(x, y, s) && (skull(x, y) || y > 28));
const back = (x, y) => (ell(x, y, CX, 31, 19.5, 19)) || (y >= 31 && y <= 56 && Math.abs(x - CX) <= 18.5 - Math.max(0, y - 40) * 0.25);
function tails(x, y) { const top = 18, bot = 70; if (y < top || y > bot) return false; const t = (y - top) / (bot - top);
  for (const side of [-1, 1]) { const cx = CX + side * (21 + 3.5 * Math.sin(t * Math.PI * 0.9)); const hw = 5.6 * (1 - t) ** 0.65 + 0.9; if (Math.abs(x - cx) <= hw) return true; } return false; }
const tie = (x, y) => [-1, 1].some(s => ell(x, y, CX + s * 21.5, 20, 3.2, 2.6));
const neck = (x, y) => y >= 46 && y <= 57 && Math.abs(x - CX) <= 4;
const body = (x, y) => y >= 55 && Math.abs(x - CX) <= Math.min(23, 7 + (y - 55) * 2.4 + Math.min(6, Math.max(0, y - 57) * 1.5));
const collar = (x, y) => body(x, y) && y <= 66 && !(Math.abs(x - CX) <= Math.max(0, 6 - (y - 55) * 0.8) && y < 63) && Math.abs(x - CX) <= 8 + (y - 55) * 1.5;
const ribbon = (x, y) => (ell(x, y, CX - 3.5, 62, 3.5, 2.3) || ell(x, y, CX + 3.5, 62, 3.5, 2.3) || (Math.abs(x - CX) <= 1 && y >= 61 && y <= 63)) || ([[-1, 0], [1, 0]].some(([s]) => Math.abs(x - (CX + s * 2.5 + s * (y - 64) * 0.5)) <= 1 && y >= 64 && y <= 68));
const band = (x, y) => { const d = Math.hypot(x - CX, (y - 31) * 1.02); return d >= 19 && d <= 21.2 && y < 28; };
const cup = (x, y) => [-1, 1].some(s => ell(x, y, CX + s * 19.5, 32, 3.6, 5.6));
const LAYERS = [[R.tails, tails], [R.back, back], [R.body, body], [R.collar, collar], [R.ribbon, ribbon], [R.neck, neck], [R.face, face], [R.bangs, bangs], [R.band, band], [R.cup, cup], [R.tie, tie]];

const EYE = { // left eye (outer corner on the left); mirrored for the right eye
  open: ['..LLLLL.', '.LLLLLLL', 'LLaaaaaL', 'Lawwaa.L', 'Lawpp a.'.replace(' ', 'p'), 'Labppb.L', 'Labbbb.L', '.bccccb.', '.bccccb.', '..LLLL..'],
  happy: ['........', '........', '........', '..LLLL..', '.L....L.', 'L......L', '........', '........', '........', '........'],
  oops: ['........', '........', 'LL......', '..LLL...', '.....LL.', '..LLL...', 'LL......', '........', '........', '........'],
  closed: ['........', '........', '........', '........', '........', '........', 'LLLLLLLL', '.L....L.', '........', '........']
};
const ECOL = { L: 'eyeL', a: 'irisA', b: 'irisB', c: 'irisC', p: 'pupil', w: 'hi', '.': null, s: 'scl' };
const MOUTH = { idle: ['L..L', '.LL.'], smile: ['LLLLL', '.LmL.', '..L..'].map(r => r), sing: ['.LL.', 'LmmL', 'LttL', '.LL.'], oops: ['L.L.L', '.L.L.'], o: ['.L.', 'LmL', '.L.'] };
const MCOL = { L: 'mouth', m: 'mouth', t: 'tongue', '.': null };

function drawHeroine(opt) {
  opt = opt || {}; const eye = opt.eye || 'open', mouth = opt.mouth || 'idle';
  const reg = new Array(W * H).fill(0);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) for (const [id, f] of LAYERS) if (f(x + 0.5, y + 0.5)) reg[y * W + x] = id;
  const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? 0 : reg[y * W + x];
  const px = new Array(W * H).fill(null);
  const order = id => LAYERS.findIndex(l => l[0] === id);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const id = at(x, y);
    if (!id) { if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => at(x + dx, y + dy))) px[y * W + x] = COL.line; continue; }
    const [b, s, d] = PAL[id]; let c = b;
    const behind = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const n = at(x + dx, y + dy); return n && n !== id && order(n) < order(id) && !(id === R.neck && n === R.body) && !(id === R.ribbon) && !(id === R.collar && n === R.body); });
    if (id === R.face || id === R.neck) { if (at(x, y - 1) === R.bangs || at(x, y - 2) === R.bangs || (id === R.neck && y < 51) || x > CX + 10) c = s; }
    if (id === R.bangs) { if (at(x, y + 1) !== R.bangs || at(x, y + 2) !== R.bangs) c = s; const d2 = Math.hypot(x + 0.5 - CX, (y + 0.5 - 30) * 1.1); if (d2 > 11 && d2 < 13.2 && y < 25 && y > 14 && (x % 7) !== 3) c = COL.hairH; }
    if (id === R.back && (y > 46 || Math.abs(x - CX) > 15)) c = s;
    if (id === R.body && (x > CX + 14 || y > 69)) c = s; if (id === R.collar && (y === 65)) c = COL.cloth;
    if (id === R.cup && x % 64 && ell(x + 0.5, y + 0.5, CX + (x > CX ? 19.5 : -19.5), 32, 1.6, 3)) c = s;
    if (id === R.band && y < 13) c = COL.phoneH;
    if (behind && id === R.bangs && at(x, y + 1) !== R.face) { px[y * W + x] = COL.hairS; continue; }
    if (id === R.tails) { const t = (y - 18) / 52, side = x < CX ? -1 : 1, tc = CX + side * (21 + 3.5 * Math.sin(t * Math.PI * 0.9)), hw = 5.6 * (1 - t) ** 0.65 + 0.9, rel = (x + 0.5 - tc) / hw * side;
      c = rel > 0.45 ? s : (rel > -0.35 && rel < -0.05 && y > 24 && y % 9 < 6) ? COL.hairH : (y > 56 ? s : b); }
    px[y * W + x] = behind ? COL[d] : COL[c] || c;
  }
  const put = (x, y, key, map) => { const k = map[key]; if (k) px[y * W + x] = COL[k]; };
  const E = EYE[eye];
  E.forEach((row, j) => [...row].forEach((ch, i) => { put(19 + i, 35 + j, ch, ECOL); put(44 - i, 35 + j, ch, ECOL); }));
  if (eye === 'open') { // sclera on inner side
    for (let j = 3; j < 7; j++) { px[(35 + j) * W + 26] = COL.scl; px[(35 + j) * W + 37] = COL.scl; } }
  // blush
  for (const bx of [20, 40]) for (let i = 0; i < 3; i++) px[46 * W + bx + i * 2] = COL.blush;
  const M = MOUTH[mouth], mx = CX - Math.floor(M[0].length / 2), my = 47 - (M.length > 2 ? 1 : 0);
  M.forEach((row, j) => [...row].forEach((ch, i) => put(mx + i, my + j, ch, MCOL)));
  if (opt.sweat) [[52, 20], [51, 21], [52, 21], [53, 21], [51, 22], [52, 22], [53, 22], [52, 23]].forEach(([x, y]) => px[y * W + x] = COL.sweat);
  return { w: W, h: H, px };
}
root.drawHeroine = drawHeroine;
})(typeof window !== 'undefined' ? window : module.exports);

</script>

  const last = G.stage === STAGES.length - 1, all = P.stars.every(s => s > 0);
  say(st.clear, false, last || all ? [['처음부터 듣기', playSong]] : [['다음 소절 ▸', () => openStage(G.stage + 1)]]);
}

/* ---------- song strip ---------- */
function renderBars() {
  const wrap = $('bars'); wrap.innerHTML = '';
  STAGES.forEach((st, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'bar'; b.disabled = i > P.unlocked; b.setAttribute('aria-label', `${i + 1}소절 ${st.title}` + (P.stars[i] ? ' 완성' : ''));
    if (G.mode !== 'title' && G.mode !== 'song' && i === G.stage) b.setAttribute('aria-current', 'true');
    const cv = document.createElement('canvas'); cv.width = 8; cv.height = 6; const x = cv.getContext('2d');
    if (P.stars[i]) { const order = ['A', 'G', 'E', 'D', 'C'];
      st.lanes.forEach((l, y) => st.sol[y].forEach((v, sx) => { if (!v) return; x.fillStyle = LANES[l].c; if (MELODY.has(l)) x.fillRect(sx, order.indexOf(l), 1, 1); else x.fillRect(sx, 5, 1, 1); })); }
    else { x.fillStyle = '#3d3785'; for (let sx = 0; sx < 8; sx += 2) x.fillRect(sx, 3, 1, 1); }
    const n = div('n'); n.innerHTML = `<span>${i + 1}</span><i>${'★'.repeat(P.stars[i])}</i>`;
    b.append(cv, n); b.addEventListener('click', () => { if (G.mode === 'song') return; initAudio(); openStage(i); }); wrap.append(b);
  });
}
function markPlayingBar(i) { document.querySelectorAll('.bar').forEach((b, k) => b.classList.toggle('playing', k === i)); }

/* ---------- dialogue ---------- */
let typeTimer = null;
function say(text, quick, actions) {
  const p = $('line'); clearInterval(typeTimer);
  if (reduceMotion || quick) p.textContent = text;
  else { let i = 0; p.textContent = ''; typeTimer = setInterval(() => { i += 1; p.textContent = text.slice(0, i); if (i >= text.length) clearInterval(typeTimer); }, 28); }
  if (actions) { const a = $('act'); a.innerHTML = ''; actions.forEach(([label, fn, ghost]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; if (ghost) b.className = 'ghost'; b.addEventListener('click', () => { initAudio(); fn(); }); a.append(b); }); }
}
function talk(lines, done, lastLabel = '시작 ▸') { let i = 0; const next = () => { if (i >= lines.length) return done(); const last = i === lines.length - 1; say(lines[i++], false, [[last ? lastLabel : '다음 ▸', next]]); }; next(); }
function setScene(size) { $('scene').dataset.size = size; sizeHeroine(); }
function showPlayUI(on) { ['boardWrap', 'controls', 'hint'].forEach(id => $(id).hidden = !on); if (on) fitBoard(); }
function fitBoard() {
  const b = $('board'), wrap = $('boardWrap'); if (wrap.hidden) return;
  const inner = wrap.clientWidth - 18, narrow = inner < 330, lab = narrow ? 30 : 34, gap = narrow ? 2 : 3;
  const rcW = Math.max(0, ...[...b.querySelectorAll('.rc')].map(e => e.scrollWidth));
  const cell = Math.max(22, Math.min(40, Math.floor((inner - lab - rcW - gap * 9) / 8)));
  b.style.setProperty('--cell', cell + 'px'); b.style.setProperty('--lab', lab + 'px'); b.style.gap = gap + 'px';
}
function updateMiss() { $('miss').textContent = G.mode === 'song' ? '' : '실수 ' + G.misses; }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200); }

/* ---------- flow ---------- */
function openStage(i) {
  G.stage = i; G.mode = 'intro'; G.misses = 0; updateMiss(); stopLoop(); markPlayingBar(-1);
  const st = STAGES[i]; $('stageLabel').textContent = `${i + 1}소절 · ${st.title}`; expr.base = 'idle';
  setScene('big'); showPlayUI(false); $('act').innerHTML = ''; renderBars();
  talk(st.intro, () => { G.mode = 'play'; setScene('small'); buildBoard(i); showPlayUI(true); $('hint').hidden = i > 0; say('같이 채워 보자! 지금 채운 음이 계속 반복해서 들릴 거야.', true, []); startLoop(); });
}
function playSong() {
  G.mode = 'song'; G.songBar = 0; expr.base = 'happy'; setScene('big'); showPlayUI(false); $('boardWrap').hidden = false; $('stageLabel').textContent = '별빛 멜로디 · 전곡';
  buildBoard(0, true); updateMiss(); renderBars(); say('처음부터 끝까지, 우리 노래야. 들어 줘!', false, [['멈추기', () => { stopLoop(); onSongEnd(); }, true]]); startLoop();
}
function onSongEnd() {
  if (G.mode !== 'song') return; stopLoop(); markPlayingBar(-1); G.mode = 'ending';
  talk(['고마워. 네 덕분에 노래를 되찾았어.', '주말 라이브, 맨 앞줄에 자리 맡아 둘게!'], () => say('언제든 다시 들으러 와!', true, [['다시 듣기', playSong], ['소절 고르기', () => openStage(P.unlocked), true]]), '다음 ▸');
}
function title() {
  G.mode = 'title'; setScene('big'); showPlayUI(false); renderBars();
  const anyDone = P.stars.some(s => s > 0);
  say('와 줬구나! 나는 리아. 이번 주말 옥상 라이브에서 부를 곡이 있는데… 악보 복원을 도와줄래?', false,
    anyDone ? [['이어 하기', () => openStage(P.unlocked)], ['처음부터', () => openStage(0), true]] : [['시작하기', () => openStage(0)]]);
}

$('toolFill').addEventListener('click', () => setTool('fill'));
$('toolMark').addEventListener('click', () => setTool('mark'));
function setTool(t) { G.tool = t; $('toolFill').setAttribute('aria-pressed', t === 'fill'); $('toolMark').setAttribute('aria-pressed', t === 'mark'); }
$('playBtn').addEventListener('click', () => G.playing ? stopLoop() : startLoop());
$('muteBtn').addEventListener('click', () => { G.muted = !G.muted; $('muteBtn').textContent = G.muted ? '소리 끔' : '소리 켬'; $('muteBtn').setAttribute('aria-pressed', G.muted); if (master) master.gain.value = G.muted ? 0 : 0.55; });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.playing && G.mode !== 'song') stopLoop(); });
addEventListener('resize', () => { sizeHeroine(); fitBoard(); });

function boot(data) { if (data && data.progress) Object.assign(P, data.progress); title(); sizeHeroine(); requestAnimationFrame(frame); }
hc.addEventListener('transitionend', sizeSky);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
