function checkClear() {

  const stars = G.misses === 0 ? 3 : G.misses <= 2 ? 2 : 1;
  prog().stars[G.stage] = Math.max(prog().stars[G.stage], stars); prog().unlocked = Math.max(prog().unlocked, Math.min(STAGES.length - 1, G.stage + 1)); persist();

const typing = now => !UI.talk.quick && (now - UI.talk.t0) / 28 < UI.talk.text.length;

function talk(lines, done, lastLabel = '시작 ▸') { let i = 0; const next = () => { if (i >= lines.length) return done(); const last = i === lines.length - 1; say(lines[i++], false, [[last ? lastLabel : '다음 ▸', next]]); }; next(); }

/* ---------- flow ---------- */
function openStage(i) {

/* ---------- tutorial & hints ---------- */
function applyGuide() {
  const st = STAGES[G.stage], step = G.guide.steps[G.guide.i];
  B.glow = new Set();
  step.cells.forEach(k => { const y = st.lanes.indexOf(k[0]), x = +k.slice(1); if (G.cells[y][x] !== 'on') B.glow.add(x + ',' + y); });
  B.focus = step.row ? { row: st.lanes.indexOf(step.row) } : { col: step.col };
  say(step.say, false, []);
}
function guideProgress() {
  if (!G.guide) return; const st = STAGES[G.stage], step = G.guide.steps[G.guide.i];
  if (!step.cells.every(k => G.cells[st.lanes.indexOf(k[0])][+k.slice(1)] === 'on')) return;
  G.guide.i++; B.focus = null;
  if (G.guide.i >= G.guide.steps.length) { G.guide = null; return; }
  setTimeout(() => { if (G.guide && G.mode === 'play') applyGuide(); }, 350);
}
function hint() {
  if (G.mode !== 'play') return; initAudio();
  if (G.live && G.live.armed) { heat(-5); toast('힌트 · 관객 열기 −5'); }
  if (G.guide) { applyGuide(); return; }
  const st = STAGES[G.stage], H = st.lanes.length; let best = null;
  const left = pts => pts.filter(([x, y]) => st.sol[y][x] && G.cells[y][x] !== 'on').length;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!st.sol[y][x] || G.cells[y][x] === 'on') continue;
    const score = Math.min(left([...Array(W)].map((_, i) => [i, y])), left([...Array(H)].map((_, j) => [x, j]))) + Math.random() * 0.5;
    if (!best || score < best.score) best = { x, y, score };
  }
  if (!best) return; B.glow = new Set([best.x + ',' + best.y]); say(CAST[G.char].hint, true);
}
function cycleLead() {
  const keys = Object.keys(LEADS), cur = leadKind(); G.lead = keys[(keys.indexOf(cur) + 1) % keys.length]; initAudio();
  if (ac) lead(leadKind(), 76, ac.currentTime + 0.01, 0.9, master); toast('멜로디 악기: ' + LEADS[leadKind()]);
}
function toggleMute() { G.muted = !G.muted; if (master) master.gain.value = G.muted ? 0 : 0.55; }
function openHelp() { UI.help = true; focusKey = kbd ? 'help:ok' : null; }
function closeHelp() { UI.help = false; focusKey = kbd ? 'ctl:help' : null; }
document.addEventListener('visibilitychange', () => { if (document.hidden && G.playing && G.mode !== 'song') stopLoop(); });

function startLive(h) {

// stats pay off on stage: sense warms the crowd up, play softens mistakes, comp pre-writes a few notes as stars
function liveSetup(h) {
  selectSong(SIM[h].song);
  const enc = SONG.encore, pool = [], extra = [];
  enc.lanes.forEach((l, y) => enc.sol[y].forEach((v, x) => { if (v && !enc.givens.includes(l + x)) pool.push(l + x); }));
  for (let n = Math.floor(S.stats.comp / 3); n > 0; n--) extra.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  STAGES = SONG.stages.concat([Object.assign({}, enc, { givens: enc.givens.concat(extra) })]);
  const start = 30 + S.stats.sense * 2;
  G.live = { who: h, heat: start, start, gain: 40 / pool.length, decay: 0.3 - S.stats.sense * 0.015, penalty: 13 - S.stats.play, extra: extra.length, cheered: 0, armed: false, done: false };
}
function liveBegin() {
  const L = G.live; L.armed = true; L.t0 = L.last = performance.now(); B.heat = L.heat;
  UI.meter = true; UI.hintText = '맞히면 관객 열기가 오르고, 틀리거나 시간이 흐르면 내려가요.';

}
function heat(d) {
  const L = G.live, before = L.heat; L.heat = Math.max(5, Math.min(100, L.heat + d));
  [50, 75, 90].forEach((m, i) => { if (before < m && L.heat >= m && L.cheered <= i) { L.cheered = i + 1; cheer(0.35 + i * 0.15); toast(CHANTS[i](CAST[L.who].name)); } });
}
function liveTick(now) {
  const L = G.live; if (!L || !L.armed || G.mode !== 'play') return;
  const dt = Math.min(0.1, (now - L.last) / 1000); L.last = now; L.heat = Math.max(5, L.heat - L.decay * dt);

function talkLayout(w, compact) {
  const T = UI.talk, pad = compact ? 10 : 12, fs = compact ? 14 : 15, lh = Math.round(fs * 1.55), tw = w - pad * 2, f = font(fs);
  const lines = T.text ? wrap(T.text, f, tw) : [];
  const textH = Math.max(lines.length, compact ? 1 : 2) * lh;
  const acts = T.actions || [], ch = acts.some(a => a[2] === 'choice' || a[2] === 'locked'), grid = !ch && acts.length > 3;
  const btns = []; let bh = 0;
  if (ch) {
    let yy = 0;
    acts.forEach((a, i) => { const [main, sub] = a[0].split('\n'), ls = wrap(main, font(15), tw - 24), h = ls.length * 20 + (sub ? 16 : 0) + 16;
      btns.push({ i, a, main, sub, lines: ls, x: 0, y: yy, w: tw, h }); yy += h + 6; });
    bh = yy - 6;
  } else if (grid) {
    const odd = acts.length % 2 === 1, cw = (tw - 8) / 2, rh = acts.some(a => a[0].includes('\n')) ? 44 : 34;
    acts.forEach((a, i) => { const [main, sub] = a[0].split('\n');
      if (odd && i === 0) { btns.push({ i, a, main, sub, x: 0, y: 0, w: tw, h: rh }); return; }
      const j = odd ? i - 1 : i, top = odd ? rh + 8 : 0;
      btns.push({ i, a, main, sub, x: (j % 2) * (cw + 8), y: top + Math.floor(j / 2) * (rh + 8), w: cw, h: rh }); });
    bh = Math.max(...btns.map(b => b.y + b.h));
  } else if (acts.length || UI.nameEntry) {
    const items = acts.map((a, i) => { const [main, sub] = a[0].split('\n');
      const bw = Math.max(mw(main, font(14, true)), sub ? mw(sub, font(11)) : 0) + 28;
      return { i, a, main, sub, w: Math.min(tw, Math.ceil(bw)), h: sub ? 44 : 34 }; });
    if (UI.nameEntry) items.unshift({ input: true, w: Math.min(150, tw - (items[0] ? items[0].w + 8 : 0)), h: 34 });
    const rows = [[]]; let rw = 0;
    items.forEach(it => { if (rows[rows.length - 1].length && rw + 8 + it.w > tw) { rows.push([]); rw = 0; } rows[rows.length - 1].push(it); rw += (rw ? 8 : 0) + it.w; });
    let yy = 0;
    rows.forEach(r => { const rh = Math.max(...r.map(it => it.h)); let xx = tw - r.reduce((s, it) => s + it.w, 0) - 8 * (r.length - 1);
      r.forEach(it => { it.x = xx; it.y = yy; xx += it.w + 8; btns.push(it); }); yy += rh + 8; });
    bh = yy - 8;
  }
  return { w, pad, fs, lh, f, lines, textH, btns, bh, h: pad + 4 + textH + (btns.length ? 10 + bh : 0) + pad };
}

function drawCell(px, py, c, s, lane, x, y, now) {

  if (B.glow.has(key)) {

const helpCache = {};
function helpLayout(fs) {

}

function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const p = toLogical(e); ptr = p; kbd = false; initAudio();
  if (e.button > 0) return;
  if (boardDown(p)) { B.cur = null; try { cv.setPointerCapture(e.pointerId); } catch (_) {} return; }
  const h = topHit(p); if (h && !h.disabled) { press = { key: h.key }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
});

});

const DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
addEventListener('keydown', e => {
  if (e.target === nameInput || e.ctrlKey || e.metaKey || e.altKey) return;

    e.preventDefault(); kbd = true; initAudio();
    if (canPlay()) { focusKey = null; const H = STAGES[G.stage].lanes.length; if (!B.cur) B.cur = { x: 0, y: 0 }; else { B.cur.x = (B.cur.x + DIRS[k][0] + W) % W; B.cur.y = (B.cur.y + DIRS[k][1] + H) % H; } return; }
    const d = DIRS[k][0] + DIRS[k][1]; if (n) focusKey = focusables[fi < 0 ? (d > 0 ? 0 : n - 1) : (fi + d + n) % n].key; return;

    if (fi >= 0) { focusables[fi].fn(); return; }
    if (canPlay() && B.cur) { if (!G.cells[B.cur.y][B.cur.x]) act(B.cur.x, B.cur.y, 'fill'); return; }
    if (typing(performance.now())) { finishTyping(); return; }
    const a = (UI.talk.actions || []).find(a => !a[2]); if (a) a[1]();
    return;
  }

  if ((k === 'h' || k === 'H') && canPlay()) hint();
});
